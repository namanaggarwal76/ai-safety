[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "injectbench"
version = "0.1.0"
description = "Framework for testing whether AI agents resist malicious instructions hidden in documents, emails, tool responses and other external data."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["anthropic>=1.0", "pytest>=8"]

[project.scripts]
injectbench = "injectbench.__main__:main"

[tool.setuptools.packages.find]
include = ["injectbench*"]

[tool.setuptools.package-data]
injectbench = ["dashboard/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
